<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chatbot EntreHilosCrochet</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; }
    #chat { max-width: 600px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    .msg { margin: 10px 0; padding: 10px; border-radius: 5px; }
    .user { background: #d1e7dd; text-align: right; }
    .bot { background: #f8d7da; text-align: left; }
    input, button { padding: 10px; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>Chatbot EntreHilosCrochet 🧶</h2>
    <div id="messages"></div>
    <input type="text" id="userInput" placeholder="Escribe tu mensaje..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const mensaje = input.value.trim();
      if (!mensaje) return;

      // Mostrar mensaje del usuario
      mostrarMensaje("user", mensaje);

      // Enviar al backend
      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ mensaje: mensaje })
      });

      if (response.ok) {
        const data = await response.json();
        mostrarMensaje("bot", data.respuesta);
      } else {
        mostrarMensaje("bot", "⚠️ Error del bot");
      }

      input.value = "";
    }

    function mostrarMensaje(tipo, texto) {
      const messagesDiv = document.getElementById("messages");
      const msg = document.createElement("div");
      msg.classList.add("msg");
      msg.classList.add(tipo === "user" ? "user" : "bot");
      msg.textContent = texto;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight; // scroll automático
    }
  </script>
</body>
</html>
