<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chatbot EntreHilosCrochet</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; }
    #chat { max-width: 600px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    .msg { margin: 10px 0; padding: 10px; border-radius: 5px; }
    .user { background: #d1e7dd; text-align: right; }
    .bot { background: #f8d7da; text-align: left; }
    input, button { padding: 10px; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>Chatbot EntreHilosCrochet 🧶</h2>
    <div id="messages"></div>
    <input type="text" id="userInput" placeholder="Escribe tu mensaje..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("mensaje");
        const mensaje = input.value;

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ mensaje: mensaje })
        });

        const data = await response.json();
        mostrarMensaje("usuario", mensaje);
        mostrarMensaje("bot", data.respuesta);
        input.value = "";
    });
</script>

</body>
</html>
