<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat con Bot</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
    .msg { margin: 5px 0; }
    .user { font-weight: bold; color: blue; }
    .bot { font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h1>Chat con el Bot</h1>
  <div id="chat"></div>
  <input type="text" id="mensaje" placeholder="Escribe tu mensaje..." />
  <button onclick="enviarMensaje()">Enviar</button>

  <script>
    async function enviarMensaje() {
      const input = document.getElementById("mensaje");
      const chat = document.getElementById("chat");
      const mensaje = input.value;

      if (!mensaje) return;

      // Mostrar mensaje del usuario
      chat.innerHTML += `<div class="msg user">Tú: ${mensaje}</div>`;
      input.value = "";

      // Enviar al backend
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensaje })
      });

      const data = await response.json();

      // Mostrar respuesta del bot
      chat.innerHTML += `<div class="msg bot">Bot: ${data.respuesta}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
